title: "If You're Happy and You Know It — V2"
description: "When you try the viral clap your hands trend with a duck holding a pan... 🦆🍳💥 Peace was never an option. #bluey #capybara #duckling #ifyourehappyandyouknowit #slapstick #funny #comedy #animation #reels #fyp"
fps: 24
width: 1080
height: 1920
duration: 23.0
bg: "#eef5ea"
