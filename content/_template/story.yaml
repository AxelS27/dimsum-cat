# ==============================================================================
# DIMsum Cat Story Engine — Story Template
# ==============================================================================
# Duplicate this file into `content/<category>/<story_name>/story.yaml`.
# Renders with: python video_generator.py --story content/<category>/<story_name>
# ==============================================================================

# --- Video Metadata ---
title: "Story Title"
description: >
  Write your video description here. Add relevant hashtags below:
  #dimsumcat #cute #kawaii #fyp #animation #chibi

# --- Canvas & Video Specs ---
fps: 24
width: 1080
height: 1920
duration: 15.0               # Total video duration in seconds (auto-recalculated when tts: true)
bg: "#f5f0ec"                # Fallback canvas background hex color
bg_image: ""                 # Background image (relative to story dir or project root)

# --- Default Character ---
character: "dimsum_cat"       # Default character folder under assets/sprites/
default_animation: "normal_talk"

# --- Audio & TTS Settings ---
tts: false                   # Enable GPT-SoVITS local text-to-speech
gpt_sovits_server: "http://127.0.0.1:9880"
gpt_sovits_ref: "../../assets/audio_reference/dimsum_cat_korean.mp3"
gpt_sovits_speed: 0.88       # Voice speed (0.8 - 1.2)
tts_volume: 1.4

# Background Music
bg_music: "../../assets/music/love_maybe.mp3"
bg_music_start: "00:00"      # Start offset in music file (mm:ss or seconds)
bg_volume: 0.09              # Background music volume (0.0 to 1.0)
bg_music_fade_in: 0.0

# Dialogue Gaps (used when tts: true)
intro_gap: 0.8               # Silence before first line
between_gap: 0.65            # Silence between spoken lines
silent_beat_dur: 1.5         # Duration for non-spoken beats

# Social Metadata
watermark: ""
pinned_comment: ""

# ==============================================================================
# Beats (Timeline)
# ==============================================================================
# Available camera effects:
#   "zoom_punch"   - Dynamic beat drop punch zoom with elastic spring back
#   "slow_zoom_in" - Slow cinematic drift zoom towards center
#   "rumble"       - Screen shake/earthquake rumble
#   "sway"         - Gentle handheld camera sway
#   "flash"        - Exposure bloom flash on beat impact
#
# Available scene transitions:
#   "crossfade"    - Smooth cross-dissolve with previous beat
#   "circle_wipe"  - Expanding circular iris mask transition
#   "dip_black"    - Dip to black fade transition
#
# Available motion profiles:
#   "squash_bounce" - Playful bounce with vertical squash-and-stretch
#   "float_sine"    - Gentle hover float with subtle rotation
#   "pop_in"        - Elastic scale-up entrance pop
#   "breathe"       - Subtly rhythmic idling breathing cycle
#   "shiver_rumble" - Fast micro-shivering / nervousness
#   "sway_tilt"     - Playful tilting wobble
#   "anticipate_hop"- Anticipatory crouch then hop
# ==============================================================================

beats:
  - time: 0.0
    text: "안녕하세요!"
    sub: "Hello everyone!"
    # Word-by-word custom colors (optional, overrides default speech bubble text)
    rich_text:
      - text: "안녕"
        color: "#ea580c"
      - text: "하세요!"
        color: "#2a2a2a"
    animation: "normal_talk"
    character: "dimsum_cat"
    # Position: [x, y] coordinates (0.0 to 1.0) or presets: center, left, right, center-low
    pos: [0.50, 0.55]
    scale: 1.0
    text_size: "big"         # "small", "normal", "big", "huge"
    camera: "slow_zoom_in"
    camera_intensity: 0.8
    motion: "breathe"

  - time: 3.5
    text: "오늘도 좋은 하루 보내세요~"
    sub: "Have a wonderful day today~"
    animation: "shy_blush"
    character: "dimsum_cat"
    pos: [0.50, 0.55]
    scale: 1.15
    text_size: "big"
    camera: "zoom_punch"
    camera_intensity: 1.0
    transition: "crossfade"
    transition_dur: 0.25
    motion: "squash_bounce"
