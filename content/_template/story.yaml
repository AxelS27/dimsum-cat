# ==============================================================================
# DIMsum Cat Story Engine — Story Template
# ==============================================================================
# Duplicate this file into `content/<category>/<story_name>/story.yaml`.
# Renders with: python video_generator.py --story content/<category>/<story_name>
# ==============================================================================

# --- Video Metadata ---
title: "Story Title"
description: >
  Write your video description here. Add relevant hashtags below:
  #dimsumcat #cute #kawaii #fyp #animation #chibi

# --- Canvas & Video Specs ---
fps: 24
width: 1080
height: 1920
duration: 15.0               # Total video duration in seconds (auto-recalculated when tts: true)
bg: "#f5f0ec"                # Fallback canvas background hex color
bg_image: ""                 # Background image (relative to story dir or project root)

# --- Default Character ---
character: "dimsum_cat"       # Default character folder under assets/sprites/
default_animation: "normal_talk"

# --- Audio & TTS Settings ---
tts: false                   # Enable text-to-speech voiceover
tts_lang: "en"
gpt_sovits_server: "http://127.0.0.1:9880"
gpt_sovits_ref: ""
gpt_sovits_speed: 0.88       # Voice speed (0.8 - 1.2)
tts_volume: 1.4

# Background Music
bg_music: "../../assets/music/love_maybe.mp3"
bg_music_start: "00:00"      # Start offset in music file (mm:ss or seconds)
bg_volume: 0.09              # Background music volume (0.0 to 1.0)
bg_music_fade_in: 0.0

# Dialogue Gaps (used when tts: true)
intro_gap: 0.8               # Silence before first line
between_gap: 0.65            # Silence between spoken lines
silent_beat_dur: 1.5         # Duration for non-spoken beats

# Social Metadata
watermark: ""
pinned_comment: ""

# ==============================================================================
# Beats (Timeline)
# ==============================================================================
# Cinematic Director Camera Options (camera):
#   - "static"       - Rock-solid stationary camera (0% shake, calm & easy on the eyes)
#   - "crash_zoom"   - Super snappy dramatic snap-zoom onto target character/face
#   - "zoom_punch"   - Elastic beat drop punch zoom that springs back smoothly
#   - "slow_zoom_in" - Slow cinematic drift zoom towards center or target
#   - "slow_zoom_out"- Slow cinematic pull-back
#   - "tracking"     - Dolly camera following character from pan_from to pan_to
#   - "whip_pan"     - Fast cinematic sweep from one character to another
#   - "dutch_tilt"   - Angled camera for suspense or tension (roll: -5.0 to +5.0)
#   - "sway"         - Gentle handheld vlog drift
#   - "rumble"       - Earthquake impact shake
#
# Camera Target & Reactive Sync:
#   camera:
#     type: "crash_zoom"
#     target: "dimsum_cat"        # camera focuses directly on this character!
#     zoom: 1.35
#     reactive_actor: "dimsum_cat"# camera shakes in lockstep with character's motion!
#     reactive_factor: 0.5
#
# Available scene transitions:
#   "crossfade"    - Smooth cross-dissolve with previous beat
#   "circle_wipe"  - Expanding circular iris mask transition
#   "dip_black"    - Dip to black fade transition
#
# Available motion profiles:
#   "walk"          - Rhythmic cartoon walking gait with step squash & footstep bob
#   "float_walk"    - Dreamy, ethereal floating glide across the screen
#   "squash_bounce" - Playful bounce with vertical squash-and-stretch
#   "float_sine"    - Gentle hover float with subtle rotation
#   "pop_in"        - Elastic scale-up entrance pop
#   "breathe"       - Subtly rhythmic idling breathing cycle
#   "shiver_rumble" - Fast micro-shivering / nervousness
#   "sway_tilt"     - Playful tilting wobble
#   "anticipate_hop"- Anticipatory crouch then hop
#
# Dynamic Character Walking & Waypoints (path / move_to):
#   - move_to: [0.70, 0.65]           # smooth movement from pos to target pos
#   - path: [[0.25, 0.65], [0.50, 0.65], [0.00, 0.65], [0.50, 0.65]] # multi-waypoint path!
#   - auto_tilt: true                 # leans/tilts forward into movement direction (float for custom angle)
#   - auto_flip: true                 # automatically flips left/right to face walk direction
#   - move_speed: 1.0                 # movement speed multiplier (0.5 = 2x slower, leisurely walk)
#   - move_ease: "smooth"             # "smooth" (zero-jerk), "in_out", "linear"
#   Note: Coordinates can be 0.0-1.0 OR percentages like [25, 65] -> auto-scaled to 0.25, 0.65!
#
# Available Kawaii VFX presets (vfx):
#   "floating_hearts" - Cute pastel hearts floating upward with gentle sway
#   "sparkles"        - Twinkling 4-point diamond anime stars
#   "sweat_drops"     - Anime blue sweat drops sliding down head (nervous)
#   "anger_vein"      - Classic pulsing red anime cross mark (💢)
#   "music_notes"     - Musical notes (♪, ♫) drifting upward
#   "question_marks"  - Cute floating question mark bubbles (?)
#
# Multi-Actor Staging:
#   Optionally specify multiple actors per beat with `actors: [...]`:
#   actors:
#     - character: "taeho"
#       animation: "neutral_regal"
#       pos: [0.30, 0.65]
#       scale: 1.2
#       flip_x: false
#       ground_shadow: true
#     - character: "dimsum_cat"
#       animation: "cooking_present"
#       pos: [0.70, 0.65]
#       scale: 1.1
#       flip_x: true
#       ground_shadow: true
# ==============================================================================

beats:
  - time: 0.0
    text: "Hello bestie!"
    sub: ""
    # Word-by-word custom colors (optional, overrides default speech bubble text)
    rich_text:
      - text: "Hello "
        color: "#ea580c"
      - text: "bestie!"
        color: "#2a2a2a"
    animation: "normal_talk"
    character: "dimsum_cat"
    # Position: [x, y] coordinates (0.0 to 1.0) or presets: center, left, right, center-low
    pos: [0.50, 0.55]
    scale: 1.0
    text_size: "big"         # "small", "normal", "big", "huge"
    camera: "slow_zoom_in"
    camera_intensity: 0.8
    motion: "breathe"
    ground_shadow: true
    vfx:
      - type: "sparkles"
        intensity: 1.0

  - time: 3.5
    text: "Have the best day!"
    sub: ""
    animation: "shy_blush"
    character: "dimsum_cat"
    pos: [0.50, 0.55]
    scale: 1.15
    text_size: "big"
    camera: "zoom_punch"
    camera_intensity: 1.0
    transition: "crossfade"
    transition_dur: 0.25
    motion: "squash_bounce"
    ground_shadow: true
    vfx:
      - type: "floating_hearts"
        intensity: 1.2
