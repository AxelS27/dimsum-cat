# ==============================================================================
# DIMsum Cat — Cinematic Director Camera Showcase
# ==============================================================================
# Starring: DIMsum Cat & King Tae-ho
# Demonstrates:
# - Beat 1: "static" (Rock-solid, motionless, calm camera)
# - Beat 2: "slow_zoom_in" with target: "dimsum_cat" & reactive_actor: "dimsum_cat"
# - Beat 3: "crash_zoom" snap-zooming directly onto target: "taeho"
# - Beat 4: "dutch_tilt" subtle cinematic angle & sweet resolution

title: "King Tae-ho's Royal Tasting"
description: >
  DIMsum Cat serves a top-secret royal dish to King Tae-ho! 🐯🍲🐱
  Will the royal palate approve?

  #dimsumcat #taeho #chibi #kdrama #animation #cute #kawaii #fyp #viral

# --- Stage & Audio Specs ---
fps: 24
width: 1080
height: 1920
duration: 12.0
bg: "#fdf8f4"
bg_image: "../../../assets/background/dining_hall.png"
character: "dimsum_cat"
default_animation: "normal_talk"

tts: false
bg_music: "../../../assets/music/yummy_flavor.mp3"
bg_music_start: "00:00"
bg_volume: 0.85

watermark: ""
pinned_comment: "Did King Tae-ho give it 5 stars? ⭐⭐⭐⭐⭐"

# ==============================================================================
# Beats Timeline (Cinematic Camera Directed)
# ==============================================================================

beats:
  # Beat 1: Establishing Shot — Completely STATIC Camera (rock solid & calm)
  - time: 0.00
    text: "폐하, 오늘의 특선 요리입니다!"
    sub: "Your Majesty, today's royal special!"
    rich_text:
      - text: "폐하, "
        color: "#d97706"
      - text: "오늘의 특선 요리입니다!"
        color: "#2a2a2a"
    text_size: "big"
    camera: "static"
    transition: "dip_black"
    transition_dur: 0.30
    vfx:
      - type: "sparkles"
        intensity: 1.0
    actors:
      - character: "taeho"
        animation: "neutral_regal"
        pos: [0.30, 0.68]
        scale: 1.25
        flip_x: false
        motion: "breathe"
        motion_speed: 0.8
        ground_shadow: true
        z_index: 0
      - character: "dimsum_cat"
        animation: "cooking_present"
        pos: [0.70, 0.69]
        scale: 1.15
        flip_x: true
        motion: "squash_bounce"
        motion_speed: 1.0
        ground_shadow: true
        z_index: 1

  # Beat 2: Suspense — Slow zoom targeting DIMsum Cat + Camera shivers in sync with her!
  - time: 3.00
    text: "과연 폐하의 입맛에 맞을까...?"
    sub: "Will it suit the royal palate...?"
    rich_text:
      - text: "과연 폐하의 "
        color: "#2a2a2a"
      - text: "입맛에 맞을까...?"
        color: "#0284c7"
    text_size: "big"
    camera:
      type: "slow_zoom_in"
      target: "dimsum_cat"
      zoom: 1.18
      reactive_actor: "dimsum_cat"
      reactive_factor: 0.45
    vfx:
      - type: "sweat_drops"
    actors:
      - character: "taeho"
        animation: "first_bite"
        pos: [0.30, 0.68]
        scale: 1.25
        flip_x: false
        motion: "breathe"
        ground_shadow: true
        z_index: 0
      - character: "dimsum_cat"
        animation: "nervous_sweat"
        pos: [0.70, 0.69]
        scale: 1.15
        flip_x: true
        motion: "shiver_rumble"
        motion_intensity: 1.2
        ground_shadow: true
        z_index: 1

  # Beat 3: CRASH ZOOM Punchline! Snap-zoom onto King Tae-ho's overjoyed face!
  - time: 6.00
    text: "천상의 맛이다!! 너무 맛있어!"
    sub: "A taste of heaven!! Absolutely delicious!"
    rich_text:
      - text: "천상의 맛이다!! "
        color: "#ea580c"
      - text: "너무 맛있어!"
        color: "#dc2626"
    text_size: "huge"
    camera:
      type: "crash_zoom"
      target: "taeho"
      zoom: 1.30
      intensity: 1.1
    transition: "crossfade"
    transition_dur: 0.20
    vfx:
      - type: "floating_hearts"
        intensity: 1.2
      - type: "sparkles"
        intensity: 0.8
    actors:
      - character: "taeho"
        animation: "overjoyed_eating"
        pos: [0.30, 0.67]
        scale: 1.35
        flip_x: false
        motion: "squash_bounce"
        motion_speed: 1.4
        ground_shadow: true
        z_index: 0
      - character: "dimsum_cat"
        animation: "proud"
        pos: [0.72, 0.68]
        scale: 1.18
        flip_x: true
        motion: "anticipate_hop"
        motion_speed: 1.2
        ground_shadow: true
        z_index: 1

  # Beat 4: Sweet Resolution with subtle cinematic Dutch Tilt
  - time: 9.00
    text: "사랑을 담아 만들었어요~"
    sub: "Crafted with pure royal love~"
    rich_text:
      - text: "사랑을 담아 "
        color: "#ec4899"
      - text: "만들었어요~"
        color: "#f43f5e"
    text_size: "big"
    camera:
      type: "dutch_tilt"
      roll: -2.5
      zoom: 1.05
    vfx:
      - type: "floating_hearts"
        intensity: 1.5
    actors:
      - character: "taeho"
        animation: "more_please"
        pos: [0.30, 0.68]
        scale: 1.30
        flip_x: false
        motion: "squash_bounce"
        ground_shadow: true
        z_index: 0
      - character: "dimsum_cat"
        animation: "finger_heart"
        pos: [0.72, 0.68]
        scale: 1.18
        flip_x: true
        motion: "float_sine"
        ground_shadow: true
        z_index: 1
