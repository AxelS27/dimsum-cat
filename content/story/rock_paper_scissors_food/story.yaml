# ==============================================================================
# Rock Paper Scissors Food Challenge — Bear Couple Slapstick
# ==============================================================================
title: "Batu Gunting Kertas Makanan Berujung Maut"
description: >
  Tren suit batu gunting kertas makanan berujung slapstick maut! 🐻🍕💨
  Si cowok serakah habisin semua makanan pas ceweknya disuruh lari bolak-balik...
  Endingnya langsung kena tendangan terbang mental ke langit! 🚀💥

  #bluey #couple #slapstick #funny #animation #reels #fyp #comedy #cartoon #rockpaperscissors

fps: 24
width: 1080
height: 1920
duration: 20.5
bg: "#eef5ea"
bg_image: "assets/backgrounds/bluey_backyard.jpg"
character: "bear_boy"
default_animation: "suit_rock"

tts: false
bg_music: "assets/music/yummy_flavor.mp3"
bg_music_start: "00:00"
bg_volume: 0.70
bg_music_fade_in: 0.0

intro_gap: 0.0
between_gap: 0.0
silent_beat_dur: 1.0

watermark: ""
pinned_comment: "Pernah punya temen/pasangan yang makannya maruk kayak gini gak? 😂👇"

# ==============================================================================
# Beats Timeline
# ==============================================================================
beats:
